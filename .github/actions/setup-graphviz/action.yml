name: Set up Graphviz
description: 'Install Graphviz (including dot)'

# Examples in case of future need.
# Define inputs that callers can provide
#inputs:
#  graphviz_version:
#    description: 'Graphviz version to install'
#    required: false
#    default: '2.43'

# Define outputs to pass data back to the caller
#outputs:
#
# cache-hit:
#    description: 'Whether npm cache was hit'
#    value: ${{ steps.npm-cache.outputs.cache-hit }}

# The composite run steps
runs:
  using: 'composite'
  steps:
    - name: "Install Graphviz (Linux)"
      #if: ${{ inputs.graphviz == 'true' && runner.os == 'Linux' }}
      if: ${{ runner.os == 'Linux' }}
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install --yes graphviz

    - name: "Install Graphviz (macOS)"
      if: ${{ runner.os == 'macOS' }}
      shell: bash
      run: brew install graphviz
      env:
        HOMEBREW_NO_AUTO_UPDATE: "1"

    - name: "Install Graphviz (Windows)"
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        Import-Module "$env:ChocolateyInstall/helpers/chocolateyInstaller.psm1"
        $dot = Get-Command dot.exe -ErrorAction SilentlyContinue
        for ($attempt = 1; !$dot -and $attempt -le 3; $attempt++) {
          choco install graphviz --yes --no-progress
          # The feed can fail while choco still exits 0. Check the installed tool.
          Update-SessionEnvironment
          $dot = Get-Command dot.exe -ErrorAction SilentlyContinue
          if (!$dot -and $attempt -lt 3) {
            Start-Sleep -Seconds 10
          }
        }
        if (!$dot) {
          throw "Graphviz dot.exe is unavailable after 3 installation attempts."
        }
        & $dot.Source -V
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        # Publish the resolved directory for subsequent Actions steps.
        $graphvizBin = Split-Path -Parent $dot.Source
        $graphvizBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: "Check Graphviz installation"
      #if: ${{ inputs.graphviz == 'true' }}
      shell: bash
      run: dot -V
